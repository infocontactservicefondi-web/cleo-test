<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pannello Controllo Licenze | Amministrazione</title>
    <!-- Bootstrap 5 CSS per Interfaccia Grafica Professionale -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome per Icone -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #1e293b; color: white; }
        .card-stat { border: none; border-radius: 12px; transition: transform 0.2s; }
        .card-stat:hover { transform: translateY(-3px); }
        .table-container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .badge-active { background-color: #10b981; color: white; padding: 6px 12px; border-radius: 20px; }
        .badge-expired { background-color: #ef4444; color: white; padding: 6px 12px; border-radius: 20px; }
        .badge-warning { background-color: #f59e0b; color: white; padding: 6px 12px; border-radius: 20px; }
    </style>
    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- Header / Navbar -->
    <nav class="navbar navbar-dark mb-4">
        <div class="container-fluid px-4">
            <span class="navbar-brand mb-0 h1"><i class="fa-solid fa-user-shield me-2"></i> Dashboard Controllo Licenze</span>
            <span class="text-light small" id="liveClock"></span>
        </div>
    </nav>

    <div class="container-fluid px-4">

        <!-- Schede Statistiche -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card card-stat bg-primary text-white p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-uppercase mb-1 small fw-bold">Totale Clienti</h6>
                            <h2 class="mb-0 fw-bold" id="statTotal">0</h2>
                        </div>
                        <i class="fa-solid fa-store fa-2x opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-stat bg-success text-white p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-uppercase mb-1 small fw-bold">Licenze Attive</h6>
                            <h2 class="mb-0 fw-bold" id="statActive">0</h2>
                        </div>
                        <i class="fa-solid fa-circle-check fa-2x opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-stat bg-warning text-white p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-uppercase mb-1 small fw-bold">In Scadenza (<= 7 gg)</h6>
                            <h2 class="mb-0 fw-bold" id="statExpiring">0</h2>
                        </div>
                        <i class="fa-solid fa-triangle-exclamation fa-2x opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-stat bg-danger text-white p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-uppercase mb-1 small fw-bold">Scadute / Bloccate</h6>
                            <h2 class="mb-0 fw-bold" id="statExpired">0</h2>
                        </div>
                        <i class="fa-solid fa-ban fa-2x opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Form Nuova Licenza & Tabella -->
        <div class="row g-4">
            
            <!-- Form Inserimento -->
            <div class="col-lg-4">
                <div class="table-container">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-plus-circle text-primary me-2"></i>Attiva Nuova Licenza</h5>
                    <form id="licenseForm" onsubmit="event.preventDefault(); createLicense();">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nome Lavanderia / Ragione Sociale</label>
                            <input type="text" id="clientName" class="form-control" placeholder="es. Lavanderia Cleo" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Città</label>
                            <input type="text" id="clientCity" class="form-control" placeholder="es. Roma">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Telefono / Referente</label>
                            <input type="text" id="clientPhone" class="form-control" placeholder="es. +39 333 1234567">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Codice Licenza Univoco</label>
                            <div class="input-group">
                                <input type="text" id="licenseCode" class="form-control fw-bold" placeholder="CLEO01" required>
                                <button class="btn btn-outline-secondary" type="button" onclick="generateRandomCode()"><i class="fa-solid fa-rotate"></i> Auto</button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Durata Validità (Giorni)</label>
                            <select id="durationDays" class="form-select">
                                <option value="30">1 Mese (30 giorni)</option>
                                <option value="180">6 Mesi (180 giorni)</option>
                                <option value="365" selected>1 Anno (365 giorni)</option>
                                <option value="730">2 Anni (730 giorni)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2"><i class="fa-solid fa-paper-plane me-2"></i>Salva e Attiva Licenza</button>
                    </form>
                </div>
            </div>

            <!-- Tabella Elenco Clienti -->
            <div class="col-lg-8">
                <div class="table-container">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0"><i class="fa-solid fa-list text-primary me-2"></i>Gestione Clienti Attivi</h5>
                        <input type="text" id="searchInput" onkeyup="filterLicenses()" class="form-control form-control-sm w-50" placeholder="🔍 Cerca per cliente o codice...">
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Cliente</th>
                                    <th>Codice</th>
                                    <th>Scadenza</th>
                                    <th>Stato</th>
                                    <th class="text-end">Azioni Rapide</th>
                                </tr>
                            </thead>
                            <tbody id="licensesTableBody">
                                <tr><td colspan="5" class="text-center py-4 text-muted">Caricamento dati in corso...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Script Logica Operativa -->
    <script>
        // CONFIGURAZIONE FIREBASE (SOSTITUISCI CON I TUOI DATI REALI)
        const firebaseConfig = {
            apiKey: "INSERISCI_LA_TUA_API_KEY",
            authDomain: "TUO_PROGETTO.firebaseapp.com",
            databaseURL: "https://TUO_PROGETTO-default-rtdb.firebaseio.com",
            projectId: "TUO_PROGETTO",
            storageBucket: "TUO_PROGETTO.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abc123"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Orologio in alto
        setInterval(() => {
            document.getElementById('liveClock').innerText = new Date().toLocaleString('it-IT');
        }, 1000);

        // Generatore di Codici Casuali
        function generateRandomCode() {
            const code = 'CLEO-' + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('licenseCode').value = code;
        }

        // 1. CARICAMENTO DATI IN TEMPO REALE DA FIREBASE
        function listenLicenses() {
            db.ref('licenses').on('value', (snapshot) => {
                const tbody = document.getElementById('licensesTableBody');
                tbody.innerHTML = '';
                const data = snapshot.val();

                if (!data) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Nessuna licenza presente nel database.</td></tr>';
                    updateStats(0, 0, 0, 0);
                    return;
                }

                const today = new Date().toISOString().split('T')[0];
                let countTotal = 0, countActive = 0, countExpiring = 0, countExpired = 0;

                for (let code in data) {
                    const item = data[code];
                    countTotal++;

                    // Calcolo giorni rimanenti
                    const expiryDate = new Date(item.expiryDate);
                    const currDate = new Date(today);
                    const diffDays = Math.ceil((expiryDate - currDate) / (1000 * 60 * 60 * 24));

                    let statusBadge = '';
                    if (!item.active || diffDays < 0) {
                        statusBadge = '<span class="badge-expired"><i class="fa-solid fa-lock me-1"></i> Bloccata / Scaduta</span>';
                        countExpired++;
                    } else if (diffDays <= 7) {
                        statusBadge = `<span class="badge-warning"><i class="fa-solid fa-clock me-1"></i> Scade tra ${diffDays} gg</span>`;
                        countExpiring++;
                        countActive++;
                    } else {
                        statusBadge = '<span class="badge-active"><i class="fa-solid fa-check me-1"></i> Attiva</span>';
                        countActive++;
                    }

                    tbody.innerHTML += `
                        <tr class="license-row">
                            <td>
                                <strong class="d-block">${item.clientName || 'N/D'}</strong>
                                <small class="text-muted"><i class="fa-solid fa-location-dot me-1"></i>${item.city || 'N/D'} | <i class="fa-solid fa-phone me-1"></i>${item.phone || 'N/D'}</small>
                            </td>
                            <td><code class="fw-bold fs-6">${code}</code></td>
                            <td>${item.expiryDate}</td>
                            <td>${statusBadge}</td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-success me-1" onclick="renewLicense('${code}', 365)" title="Aggiungi 1 Anno"><i class="fa-solid fa-plus-circle me-1"></i> +1 Anno</button>
                                <button class="btn btn-sm btn-danger me-1" onclick="blockLicense('${code}')" title="Blocca Dispositivo"><i class="fa-solid fa-ban me-1"></i> Blocca</button>
                                <button class="btn btn-sm btn-outline-secondary" onclick="deleteLicense('${code}')" title="Elimina Definivamente"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                }

                updateStats(countTotal, countActive, countExpiring, countExpired);
            });
        }

        function updateStats(total, active, expiring, expired) {
            document.getElementById('statTotal').innerText = total;
            document.getElementById('statActive').innerText = active;
            document.getElementById('statExpiring').innerText = expiring;
            document.getElementById('statExpired').innerText = expired;
        }

        // 2. CREAZIONE NUOVA LICENZA
        function createLicense() {
            const code = document.getElementById('licenseCode').value.trim().toUpperCase();
            const name = document.getElementById('clientName').value.trim();
            const city = document.getElementById('clientCity').value.trim();
            const phone = document.getElementById('clientPhone').value.trim();
            const days = parseInt(document.getElementById('durationDays').value);

            if (!code || !name) {
                alert('Inserisci almeno il Nome della Lavanderia e il Codice!');
                return;
            }

            const target = new Date();
            target.setDate(target.getDate() + days);
            const expiryStr = target.toISOString().split('T')[0];

            db.ref('licenses/' + code).set({
                clientName: name,
                city: city,
                phone: phone,
                expiryDate: expiryStr,
                active: true,
                createdAt: new Date().toISOString().split('T')[0]
            }).then(() => {
                alert(`Licenza ${code} creata con successo! Scadenza: ${expiryStr}`);
                document.getElementById('licenseForm').reset();
            });
        }

        // 3. PULSANTE "+1 ANNO" (RINNOVA)
        function renewLicense(code, daysToAdd) {
            db.ref('licenses/' + code).once('value', (snapshot) => {
                const item = snapshot.val();
                let baseDate = new Date();
                
                // Se la licenza è ancora valida, prolunga dalla data di scadenza futura
                if (item && item.expiryDate && new Date(item.expiryDate) > baseDate) {
                    baseDate = new Date(item.expiryDate);
                }

                baseDate.setDate(baseDate.getDate() + daysToAdd);
                const newExpiry = baseDate.toISOString().split('T')[0];

                db.ref('licenses/' + code).update({
                    expiryDate: newExpiry,
                    active: true
                }).then(() => {
                    alert(`Licenza ${code} rinnovata fino al ${newExpiry}`);
                });
            });
        }

        // 4. PULSANTE "BLOCCA"
        function blockLicense(code) {
            if (!confirm(`Sei sicuro di voler BLOCCARE l'accesso per la licenza ${code}?`)) return;

            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const pastDate = yesterday.toISOString().split('T')[0];

            db.ref('licenses/' + code).update({
                expiryDate: pastDate,
                active: false
            }).then(() => {
                alert(`Licenza ${code} disattivata! Il tablet associato verrà bloccato.`);
            });
        }

        // 5. PULSANTE "ELIMINA"
        function deleteLicense(code) {
            if (!confirm(`Vuoi ELIMINARE DEFINITIVAMENTE la licenza ${code}?`)) return;
            db.ref('licenses/' + code).remove();
        }

        // Filtro di ricerca rapida
        function filterLicenses() {
            const filter = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('.license-row');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(filter) ? '' : 'none';
            });
        }

        // Avvio ascolto Firebase
        listenLicenses();
    </script>
</body>
</html>
