<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Statistiche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div id="sezione-statistiche" class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-graph-up-arrow"></i> Statistiche e Report</h2>
    </div>
    
    <!-- Box Filtri e Pulsante Esporta -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form id="form-filtri-statistiche" class="row g-3 align-items-end">
                <!-- Selettore Rapido -->
                <div class="col-md-3">
                    <label for="filtro-rapido" class="form-label fw-bold">Periodo</label>
                    <select id="filtro-rapido" class="form-select" onchange="gestisciFiltroRapido(this.value)">
                        <option value="tutti">Tutto lo storico</option>
                        <option value="oggi">Oggi</option>
                        <option value="mese">Questo Mese</option>
                        <option value="anno">Quest'Anno</option>
                        <option value="personalizzato">Intervallo Personalizzato</option>
                    </select>
                </div>

                <!-- Campo Data Inizio -->
                <div class="col-md-3 campi-data d-none">
                    <label for="data-inizio" class="form-label fw-bold">Data Inizio</label>
                    <input type="date" id="data-inizio" class="form-control">
                </div>

                <!-- Campo Data Fine -->
                <div class="col-md-3 campi-data d-none">
                    <label for="data-fine" class="form-label fw-bold">Data Fine</label>
                    <input type="date" id="data-fine" class="form-control">
                </div>

                <!-- Pulsanti Azione -->
                <div class="col-md-3 d-flex gap-2 ms-auto">
                    <button type="button" class="btn btn-primary w-100" onclick="caricaStatistiche()">
                        <i class="bi bi-search"></i> Filtra
                    </button>
                    <button type="button" class="btn btn-success w-100" onclick="esportaExcel()">
                        <i class="bi bi-file-earmark-excel"></i> Esporta Excel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabella Risultati -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0" id="tabella-statistiche">
                    <thead class="table-dark">
                        <tr>
                            <th>Data</th>
                            <th>Descrizione</th>
                            <th>Categoria</th>
                            <th class="text-end">Importo</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-statistiche">
                        <tr>
                            <td colspan="4" class="text-center py-4 text-muted">Caricamento dati in corso o seleziona un filtro...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
// Mostra o nasconde i campi data personalizzati in base alla selezione
function gestisciFiltroRapido(valore) {
    const campiData = document.querySelectorAll('.campi-data');
    if (valore === 'personalizzato') {
        campiData.forEach(el => el.classList.remove('d-none'));
    } else {
        campiData.forEach(el => el.classList.add('d-none'));
        document.getElementById('data-inizio').value = '';
        document.getElementById('data-fine').value = '';
    }
}

// Calcola le date di inizio e fine in base alla scelta rapida
function ottieniParametriDate() {
    const filtro = document.getElementById('filtro-rapido').value;
    let dataInizio = '';
    let dataFine = '';

    const oggi = new Date();
    const formatoData = (d) => {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    };

    if (filtro === 'oggi') {
        dataInizio = formatoData(oggi);
        dataFine = formatoData(oggi);
    } else if (filtro === 'mese') {
        const primoDelMese = new Date(oggi.getFullYear(), oggi.getMonth(), 1);
        dataInizio = formatoData(primoDelMese);
        dataFine = formatoData(oggi);
    } else if (filtro === 'anno') {
        const primoDellAnno = new Date(oggi.getFullYear(), 0, 1);
        dataInizio = formatoData(primoDellAnno);
        dataFine = formatoData(oggi);
    } else if (filtro === 'personalizzato') {
        dataInizio = document.getElementById('data-inizio').value;
        dataFine = document.getElementById('data-fine').value;
    }

    return { dataInizio, dataFine };
}

// Carica la tabella a schermo via AJAX
function caricaStatistiche() {
    const { dataInizio, dataFine } = ottieniParametriDate();
    const tbody = document.getElementById('tbody-statistiche');
    
    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4">Caricamento in corso...</td></tr>';

    fetch(`get_statistiche.php?data_inizio=${dataInizio}&data_fine=${dataFine}`)
        .then(response => response.json())
        .then(data => {
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">Nessun dato trovato per il periodo selezionato.</td></tr>';
                return;
            }

            data.forEach(row => {
                tbody.innerHTML += `
                    <tr>
                        <td>${row.data}</td>
                        <td>${row.descrizione}</td>
                        <td>${row.categoria}</td>
                        <td class="text-end fw-bold">€ ${parseFloat(row.importo).toFixed(2)}</td>
                    </tr>
                `;
            });
        })
        .catch(error => {
            console.error('Errore nel caricamento:', error);
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-4">Si è verificato un errore nel recupero dei dati.</td></tr>';
        });
}

// Genera e scarica il file Excel
function esportaExcel() {
    const { dataInizio, dataFine } = ottieniParametriDate();
    window.location.href = `export_excel.php?data_inizio=${dataInizio}&data_fine=${dataFine}`;
}

// Caricamento iniziale dei dati alla riapertura/pagina pronta
document.addEventListener('DOMContentLoaded', caricaStatistiche);
</script>

</body>
</html>
