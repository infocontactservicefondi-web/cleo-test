<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavanderia Cleo - Gestionale</title>
    <script>
        if (localStorage.getItem('laundry_theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        darkSurface: '#1E1E1E',
                        darkCard: '#242424',
                        darkBorder: '#2C2C2C'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-slate-100 min-h-screen font-sans pb-20">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 z-50 bg-darkBg/90 backdrop-blur-xl flex items-center justify-center p-4">
        <div class="bg-darkSurface p-8 rounded-3xl shadow-2xl w-full max-w-md border border-darkBorder text-center space-y-6">
            <div class="w-16 h-16 bg-blue-600/20 text-blue-500 rounded-2xl mx-auto flex items-center justify-center text-2xl shadow-lg">
                <i class="fa-solid fa-shirt"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Lavanderia Cleo</h1>
            
            <div id="licenseRegisterArea" class="bg-darkCard p-4 rounded-2xl border border-darkBorder text-left space-y-3">
                <span class="text-xs font-bold text-white uppercase tracking-wider">Licenza Dispositivo</span>
                <div class="flex gap-2">
                    <input type="text" id="licensePhoneInput" placeholder="Codice licenza..." class="w-full px-3 py-2 bg-darkBg border border-darkBorder rounded-xl text-xs text-white focus:outline-none uppercase font-mono">
                    <button type="button" onclick="checkNumericLicense(event)" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold cursor-pointer shrink-0">Attiva</button>
                </div>
            </div>

            <div class="border-t border-darkBorder pt-4">
                <form id="loginForm" class="space-y-4">
                    <input type="password" id="passwordInput" placeholder="Password amministratore" class="w-full px-4 py-3 bg-darkCard border border-darkBorder rounded-xl text-sm text-white focus:outline-none">
                    <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl text-sm cursor-pointer shadow-lg shadow-blue-600/20">Accedi al Gestionale</button>
                </form>
            </div>
            <p id="loginError" class="text-rose-500 text-xs hidden font-medium"></p>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="appContainer" class="hidden max-w-7xl mx-auto p-4 sm:p-6 space-y-6">

        <!-- HEADER (SENZA PULSANTE LOGOUT) -->
        <header class="flex items-center justify-between gap-4 bg-darkSurface p-4 rounded-2xl border border-darkBorder shadow-sm">
            <div class="flex items-center gap-3">
                <div id="protectedLogoBtn" class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center text-lg shadow-sm cursor-pointer relative overflow-hidden" title="Tieni premuto 5 secondi">
                    <i class="fa-solid fa-shirt"></i>
                    <div id="logoProgressFill" class="absolute bottom-0 left-0 w-full bg-blue-400/40 h-0"></div>
                </div>
                <div>
                    <h1 class="text-base font-bold text-white leading-tight">Lavanderia Cleo</h1>
                    <div class="flex items-center gap-2 text-xs">
                        <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                        <span id="statusText" class="text-emerald-400 font-medium">Online</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="toggleTheme()" class="p-2.5 bg-darkCard hover:bg-zinc-800 rounded-xl text-xs text-slate-200 cursor-pointer">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- NAVIGATION TABS -->
        <div class="flex gap-2 border-b border-darkBorder pb-3">
            <button onclick="switchTab('active')" id="navTabActive" class="px-4 py-2 rounded-lg text-xs font-semibold bg-blue-600 text-white cursor-pointer">
                <i class="fa-solid fa-box-archive mr-1.5"></i> Capi in Lavorazione
            </button>
            <button onclick="switchTab('stats')" id="navTabStats" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white cursor-pointer">
                <i class="fa-solid fa-chart-pie mr-1.5"></i> Storico & Statistiche
            </button>
        </div>

        <!-- VIEW ACTIVE -->
        <div id="viewActive" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1 space-y-6">
                <!-- FORM CLIENTE -->
                <div class="bg-darkSurface p-5 rounded-2xl border border-darkBorder shadow-sm space-y-4">
                    <h2 class="text-sm font-bold text-white"><i class="fa-solid fa-user-plus text-blue-400 mr-1"></i> Nuovo Cliente</h2>
                    <form id="clientForm" class="space-y-3">
                        <input type="text" id="clientName" placeholder="Nome e Cognome *" required class="w-full px-3 py-2 bg-darkCard border border-darkBorder rounded-xl text-xs text-white">
                        <input type="tel" id="clientPhone" placeholder="Telefono *" required class="w-full px-3 py-2 bg-darkCard border border-darkBorder rounded-xl text-xs text-white">
                        <input type="text" id="clientDob" placeholder="Data Nascita (GG/MM/AAAA)" class="w-full px-3 py-2 bg-darkCard border border-darkBorder rounded-xl text-xs text-white">
                        <input type="text" id="clientAddress" placeholder="Indirizzo" class="w-full px-3 py-2 bg-darkCard border border-darkBorder rounded-xl text-xs text-white">
                        <button type="submit" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold cursor-pointer">Registra Cliente</button>
                    </form>
                </div>

                <!-- FORM CAPO -->
                <div class="bg-darkSurface p-5 rounded-2xl border border-darkBorder shadow-sm space-y-4">
                    <h2 class="text-sm font-bold text-white"><i class="fa-solid fa-shirt text-blue-400 mr-1"></i> Nuovo Capo</h2>
                    <form id="itemForm" class="space-y-3">
                        <input type="hidden" id="selectedClientIdInput" required>
                        <input type="text" id="assignClientSearch" placeholder="Cerca cliente..." class="w-full px-3 py-2 bg-darkCard border border-darkBorder rounded-xl text-xs text-white">
                        <input type="text" id="itemType" placeholder="Tipologia Capo *" required class="w-full px-3 py-2 bg-darkCard border border-darkBorder rounded-xl text-xs text-white">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="itemCabinet" placeholder="Armadio *" required class="w-full px-3 py-2 bg-darkCard border border-darkBorder rounded-xl text-xs text-white">
                            <input type="text" id="itemPosition" placeholder="Posizione *" required class="w-full px-3 py-2 bg-darkCard border border-darkBorder rounded-xl text-xs text-white">
                        </div>
                        <input type="number" step="0.05" id="itemPrice" placeholder="Prezzo (€)" class="w-full px-3 py-2 bg-darkCard border border-darkBorder rounded-xl text-xs text-white">
                        <button type="submit" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold cursor-pointer">Aggiungi Capo</button>
                    </form>
                </div>
            </div>

            <!-- TABELLA -->
            <div class="lg:col-span-2 bg-darkSurface p-5 rounded-2xl border border-darkBorder shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-sm font-bold text-white">Capi in Deposito</h2>
                    <span id="itemsCounterBadge" class="px-2.5 py-1 bg-blue-950 text-blue-400 border border-blue-900 rounded-lg text-xs font-semibold">0 capi</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-darkBorder text-[11px] font-bold text-slate-400 uppercase">
                                <th class="py-3 px-4">Cliente</th>
                                <th class="py-3 px-4">Capo</th>
                                <th class="py-3 px-4">Posizione</th>
                                <th class="py-3 px-4">Stato</th>
                                <th class="py-3 px-4 text-right">Azione</th>
                            </tr>
                        </thead>
                        <tbody id="itemsTableBody" class="divide-y divide-darkBorder/50 text-xs"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- VIEW STATS -->
        <div id="viewStats" class="space-y-6 hidden">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-darkSurface p-5 rounded-2xl border border-darkBorder">
                    <div class="text-slate-400 text-xs mb-1">Capi Ritirati</div>
                    <div id="statTotalCount" class="text-2xl font-bold text-white">0</div>
                </div>
                <div class="bg-darkSurface p-5 rounded-2xl border border-darkBorder">
                    <div class="text-slate-400 text-xs mb-1">Incasso Totale</div>
                    <div id="statTotalRevenue" class="text-2xl font-bold text-emerald-400">€ 0.00</div>
                </div>
                <div class="bg-darkSurface p-5 rounded-2xl border border-darkBorder">
                    <div class="text-slate-400 text-xs mb-1">Clienti Unici</div>
                    <div id="statUniqueClients" class="text-2xl font-bold text-white">0</div>
                </div>
            </div>

            <div class="bg-darkSurface p-5 rounded-2xl border border-darkBorder">
                <div class="flex gap-2 mb-4">
                    <button onclick="setStatPeriod('day')" class="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-semibold">Oggi</button>
                    <button onclick="setStatPeriod('month')" class="px-3 py-1.5 bg-darkCard text-slate-300 rounded-lg text-xs font-semibold">Questo Mese</button>
                    <button onclick="setStatPeriod('all')" class="px-3 py-1.5 bg-darkCard text-slate-300 rounded-lg text-xs font-semibold">Tutto</button>
                </div>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-darkBorder text-[11px] font-bold text-slate-400 uppercase">
                            <th class="py-3 px-4">Data</th>
                            <th class="py-3 px-4">Cliente</th>
                            <th class="py-3 px-4">Capo</th>
                            <th class="py-3 px-4">Prezzo</th>
                            <th class="py-3 px-4">Posizione</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody" class="divide-y divide-darkBorder/50 text-xs"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="app.js"></script>
</body>
</html>
